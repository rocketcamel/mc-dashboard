[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.89"
aws-config = "1.8.16"
aws-sdk-dynamodb = "1.111.0"
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
console = "0.16.3"
dotenvy = "0.15.7"
k8s-openapi = { version = "0.27.1", features = ["v1_31"] }
kube = "3.1.0"
openssh = "0.11.6"
rand_core = { version = "0.6", features = ["std"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
thiserror-ext = "0.3.0"
time = "0.3.47"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
