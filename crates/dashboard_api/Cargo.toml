[package]
name = "dashboard_api"
version = "0.2.0"
edition = "2024"

[dependencies]
dashboard_k3s = { path = "../dashboard_k3s" }
types = { path = "../dashboard_types", package = "dashboard_types" }
storage = { path = "../dashboard_storage", package = "dashboard_storage" }
axum = { workspace = true }
console = "0.16.3"
dotenvy = "0.15.7"
futures = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.13.2", features = ["json"] }
rustls = { version = "0.23.39", features = ["ring"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
thiserror-ext = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = "0.3.47"
tower-http = { version = "0.6.8", features = ["trace", "fs"] }
tower-sessions = { workspace = true }
